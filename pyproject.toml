[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-tracker-cli"
version = "1.0.0"
description = "A dependency-free command-line tool to track, analyse and export personal expenses."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
]

[project.scripts]
expense-tracker = "expense_tracker.cli:main"

[tool.setuptools]
packages = ["expense_tracker"]
